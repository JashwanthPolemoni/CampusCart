<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details | CampusCart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- NAVBAR (dynamic via app.js) -->
    <header class="navbar">
        <div class="container nav-container"></div>
    </header>



    <!-- ================= BREADCRUMB ================= -->

    <section class="product-breadcrumb">

        <div class="container">

            <a href="products.html">
                ← Back to Products
            </a>

        </div>

    </section>



    <!-- ================= PRODUCT ================= -->

    <main class="product-details-page">

        <div class="container">

            <div
                id="productDetails"
                class="product-details-layout"
            >
            </div>


            <!-- NOT FOUND -->

            <div
                id="productNotFound"
                class="no-listings"
            >

                <div class="no-listings-icon">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>

                <h2>
                    Product Not Found
                </h2>

                <p>
                    This product may have been removed
                    or the link is invalid.
                </p>

                <a
                    href="products.html"
                    class="btn btn-primary"
                >
                    Browse Products
                </a>

            </div>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-content">

                <div>

                    <h2>
                        Campus<span>Cart</span>
                    </h2>

                    <p>
                        Buy. Sell. Exchange.
                        Right on Campus.
                    </p>

                </div>


                <div class="footer-links">

                    <a href="home.html">
                        Home
                    </a>

                    <a href="products.html">
                        Browse
                    </a>

                    <a href="sell.html">
                        Sell
                    </a>

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>


            <div class="footer-bottom">

                <p>
                    © 2026 CampusCart.
                    Student Marketplace Prototype.
                </p>

            </div>

        </div>

    </footer>



    <script src="js/app.js"></script>
    <script src="js/product-details.js"></script>

</body>

</html>
