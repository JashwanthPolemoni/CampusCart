<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse items listed by students on CampusCart - India's student marketplace for books, electronics, lab equipment and more.">
    <title>Browse Items | CampusCart</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Loading skeleton */
        .skeleton-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(99,102,241,0.07);
        }
        .skeleton-img {
            width: 100%;
            height: 200px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-body { padding: 16px; }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .product-real-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .product-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-size: 3rem;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="home.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>CampusCart</span>
            </a>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="products.html" class="active">Browse</a>
                <a href="sell.html">Sell</a>
                <a href="favorites.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path></svg>
                </a>
                <a href="messages.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
                </a>
                <a href="profile.html" class="btn btn-primary">Profile</a>
            </nav>
        </div>
    </header>


    <!-- PAGE HEADER -->
    <main>
        <section class="products-header">
            <div class="container">
                <span class="section-label">CAMPUS MARKETPLACE</span>
                <h1>Find What You Need</h1>
                <p>Browse items listed by students around your campus.</p>

                <!-- SEARCH -->
                <div class="search-container">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" placeholder="Search books, electronics, calculators...">
                </div>
            </div>
        </section>


        <!-- PRODUCTS AREA -->
        <section class="products-section">
            <div class="container products-layout">

                <!-- FILTERS -->
                <aside class="filter-sidebar">
                    <div class="filter-header">
                        <h3>Filters</h3>
                        <button type="button" id="clearFilters">Clear All</button>
                    </div>

                    <!-- CATEGORY -->
                    <div class="filter-group">
                        <h4>Category</h4>
                        <label class="filter-option">
                            <input type="radio" name="category" value="all" checked>
                            <span>All Items</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="books">
                            <span>Books</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="electronics">
                            <span>Electronics</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="lab">
                            <span>Lab Equipment</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="stationery">
                            <span>Stationery</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="hostel">
                            <span>Hostel</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="category" value="accessories">
                            <span>Accessories</span>
                        </label>
                    </div>

                    <!-- CONDITION -->
                    <div class="filter-group">
                        <h4>Condition</h4>
                        <label class="filter-option">
                            <input type="checkbox" name="condition" value="new">
                            <span>Like New</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="condition" value="good">
                            <span>Good</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="condition" value="used">
                            <span>Used</span>
                        </label>
                    </div>

                    <!-- PRICE -->
                    <div class="filter-group">
                        <h4>Maximum Price</h4>
                        <input type="range" id="priceRange" min="100" max="5000" value="5000" step="100">
                        <div class="price-range-label">
                            <span>₹100</span>
                            <strong id="priceValue">₹5000</strong>
                        </div>
                    </div>
                </aside>


                <!-- PRODUCTS -->
                <div class="products-content">
                    <div class="products-toolbar">
                        <div>
                            <strong id="resultCount">0</strong>
                            <span>items found</span>
                        </div>
                        <select id="sortSelect">
                            <option value="latest">Sort: Latest</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                            <option value="name">Name: A-Z</option>
                        </select>
                    </div>

                    <!-- PRODUCT GRID (populated by JS from MongoDB) -->
                    <div class="products-grid" id="productsGrid">
                        <!-- Skeleton loaders shown while fetching -->
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                    </div>

                    <!-- EMPTY STATE -->
                    <div class="empty-products" id="emptyProducts" style="display:none;">
                        <div>
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </div>
                        <h3>No items found</h3>
                        <p>Try changing your search or filters.</p>
                    </div>
                </div>

            </div>
        </section>
    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>© 2026 CampusCart. Built for students.</p>
            </div>
        </div>
    </footer>


    <script src="js/app.js"></script>
    <script src="js/products.js"></script>

</body>
</html>
